services:
  - type: web
    name: hunter254-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_ID
        sync: false
      - key: SESSION_DIR
        value: /tmp/whatsapp-session
      - key: DATABASE_URL
        sync: false
